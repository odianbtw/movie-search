spring:
  application:
    name: movie-search

  datasource:
    url: jdbc:postgresql://localhost:5432/movie_search_db
    username: admin
    password: Test1234_
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

    properties:

      hibernate:
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        show_sql: true
        format_sql: true


logging:
  level:
    org:
      hibernate:
        sql: DEBUG
        orm:
          jdbc:
            bind: TRACE
        engine:
          jdbc:
            batch:
              internal:
                BatchingBatch: DEBUG